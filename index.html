<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Interés Simple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Calculadora de Interés Simple</h1>
  
  <form id="interestForm">
    <label for="principal">Capital (P):</label>
    <input type="number" id="principal" required><br><br>

    <label for="rate">Tasa de interés (%) (R):</label>
    <input type="number" id="rate" required><br><br>

    <label for="time">Tiempo en años (T):</label>
    <input type="number" id="time" required><br><br>

    <button type="submit">Calcular</button>
  </form>

  <h2>Resultado: <span id="result"></span></h2>

  <script src="script.js"></script>
</body>
</html>
