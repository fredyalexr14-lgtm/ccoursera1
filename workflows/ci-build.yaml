name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Paso 3: Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 nose coverage

      # Paso 4: Lint del código
      - name: Run Lint (flake8)
        run: |
          flake8 .

      # Paso 5: Ejecutar pruebas unitarias con cobertura
      - name: Run Unit Tests (nose with coverage)
        run: |
          nosetests --with-coverage --cover-package=src --cover-html --cover-erase
