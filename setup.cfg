[nosetests]
verbosity = 2
with-coverage = true
cover-erase = true
cover-package = src

[coverage:report]
show_missing = true
omit =
    tests/*
    setup.py

[flake8]
max-line-length = 88
exclude = .git,__pycache__,docs,build,dist
statistics = True

[pylint]
disable = C0114,C0115,C0116
max-line-length = 88
output-format = colorized


